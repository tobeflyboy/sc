# 应用配置文件
spring:
  # 应用基本信息
  application:
    name: sc-gateway # 应用名称，用于服务注册和发现
  # 环境配置
  profiles:
    active: ${ENV:dev} # 当前激活的环境，对应Nacos中的配置文件
  # 云服务配置
  cloud:
    # Nacos配置
    nacos:
      # Nacos公共参数
      server-addr: ${NACOS_SERVER_ADDR:centaline-nacos-test.centaline.com.cn:8848} # Nacos服务器地址
      username: ${NACOS_USERNAME:nacos} # Nacos登录用户名
      password: ${NACOS_PASSWORD:nacos} # Nacos登录密码
      # 服务发现配置
      discovery:
        namespace: ${NACOS_NAMESPACE:dev-namespace} # 配置命名空间
        group: ${NACOS_GROUP:nutcracker} # 配置分组
        # 连接超时和重试配置
        heart-beat-interval: 5000 # 心跳间隔（毫秒）
        heart-beat-timeout: 15000 # 心跳超时时间（毫秒）
        naming-load-cache-at-start: true # 启动时加载缓存
      # 配置中心配置
      config:
        namespace: ${NACOS_NAMESPACE:dev-namespace} # 配置命名空间
        group: ${NACOS_GROUP:nutcracker} # 配置分组
        # 关键配置：关闭启动时的配置导入检查
        # 防止在加载import配置之前就报错
        import-check:
          enabled: false
  # 核心配置：配置导入
  # 注意：此配置必须与cloud节点平级
  config:
    import:
      # 从Nacos导入配置文件，指定配置ID、分组和自动刷新
      # 标记为optional，避免找不到配置时应用启动失败
      - optional:nacos:sc-gateway.application.yaml?group=${NACOS_GROUP:nutcracker}&refresh=true
